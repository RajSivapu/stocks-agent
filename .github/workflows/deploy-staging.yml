name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      STAGING_PROJECT_REF: ${{ secrets.STAGING_PROJECT_REF }}
      STAGING_POSTGRES_URL: ${{ secrets.STAGING_POSTGRES_URL }}
      STAGING_SUPAVISOR_SESSION_URL: ${{ secrets.STAGING_SUPAVISOR_SESSION_URL }}
      STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      STAGING_OPERATOR_ID: ${{ secrets.STAGING_OPERATOR_ID }}
      STAGING_CONNECTION_PUBLIC_ID: ${{ secrets.STAGING_CONNECTION_PUBLIC_ID }}
      STAGING_WEB_URL: ${{ vars.STAGING_WEB_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: install-dependencies
        run: |
          python -m pip install --requirement requirements-ci.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: staging-preflight
        run: >-
          python scripts/deploy_and_verify.py staging-preflight
          --project-ref "$STAGING_PROJECT_REF"
          --confirm "DEPLOY STAGING $STAGING_PROJECT_REF"
      - name: apply-staging-migrations
        run: |
          npx --yes supabase@2.116.0 link --project-ref "$STAGING_PROJECT_REF"
          npx --yes supabase@2.116.0 db push --linked --include-all
      - name: provision-runtime-roles
        run: python scripts/provision_runtime_roles.py --project-ref "$STAGING_PROJECT_REF"
      - name: deploy-edge-functions
        run: |
          npx --yes supabase@2.116.0 functions deploy app-api --project-ref "$STAGING_PROJECT_REF"
          npx --yes supabase@2.116.0 functions deploy telegram-portfolio --project-ref "$STAGING_PROJECT_REF"
          npx --yes supabase@2.116.0 functions deploy agent-gateway --project-ref "$STAGING_PROJECT_REF"
          npx --yes supabase@2.116.0 functions deploy run-scheduler --project-ref "$STAGING_PROJECT_REF"
      - name: build-static-web
        env:
          VITE_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: npm --workspace apps/web run build
      - name: build-output-scan
        run: python scripts/deploy_and_verify.py scan-build --dist apps/web/dist
      - name: deploy-static-web
        run: >-
          npx --yes wrangler@4.128.0 deploy
          --config apps/web/wrangler.jsonc
          --name stocks-agent-staging-web
      - name: create-security-test-users
        run: >-
          python scripts/create_security_test_users.py
          --email-a "security-a-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@tests.invalid"
          --email-b "security-b-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@tests.invalid"
          --output "$RUNNER_TEMP/security-users.json"
      - name: capture-security-test-identities
        run: |
          python - "$RUNNER_TEMP/security-users.json" "$GITHUB_ENV" <<'PY'
          import json
          import sys
          from pathlib import Path
          bundle = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
              output.write(f"STAGING_TEST_OWNER_A_ID={bundle['owner_a']['id']}\n")
              output.write(f"STAGING_TEST_OWNER_B_ID={bundle['owner_b']['id']}\n")
          PY
      - name: live-browser-security-acceptance
        env:
          E2E_LIVE: 1
          E2E_BASE_URL: ${{ vars.STAGING_WEB_URL }}
          E2E_SECURITY_USERS_FILE: ${{ runner.temp }}/security-users.json
          E2E_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          E2E_SUPABASE_PUBLISHABLE_KEY: ${{ vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
        run: npm --workspace apps/web run test:e2e
      - name: staging-verify
        run: >-
          python scripts/deploy_and_verify.py staging-verify
          --commit "$(git rev-parse HEAD)"
          --security-users "$RUNNER_TEMP/security-users.json"
          --report "$RUNNER_TEMP/staging-report.json"
      - name: cleanup-security-test-users
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/security-users.json" ]]; then
            python scripts/create_security_test_users.py --cleanup-bundle "$RUNNER_TEMP/security-users.json"
          fi
