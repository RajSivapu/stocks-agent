name: Owner dashboard verification

on:
  push:
    branches: [main, codex/owner-alert-v3]
  pull_request:

permissions:
  contents: read

concurrency:
  group: owner-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python311-collector-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"
      - run: python -m venv .venv
      - run: >-
          .venv/bin/pip install --require-hashes --only-binary=:all: -r requirements.lock
      - run: >-
          .venv/bin/python -m pytest tests/test_python_runtime_compatibility.py -q
      - run: >-
          .venv/bin/python -c
          'import lib.intelligence.research_queue; import lib.intelligence.learning; import scripts.collect_market_intelligence'

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Bind verification to the workflow SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: python -m venv .venv
      - run: >-
          .venv/bin/pip install --require-hashes --only-binary=:all: -r requirements.lock
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high --omit=optional --ignore-scripts
      - run: node scripts/check_dependency_licenses.mjs
      - run: npx playwright install --with-deps chromium
      - run: .venv/bin/python -m pytest tests/test_verify_personal_stock_agent_v1.py -q
      - run: npm run test:all
