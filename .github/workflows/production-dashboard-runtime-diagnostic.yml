name: Production dashboard runtime diagnostic

on:
  workflow_dispatch:
    inputs:
      ci_workflow_run_id:
        description: Successful exact-main owner CI workflow run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-dashboard-runtime-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    environment: owner-dashboard-production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PGSSLMODE: verify-full
      PGSSLROOTCERT: ${{ github.workspace }}/config/supabase-prod-ca-2021.crt
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.14"
      - name: Bind checkout to current main and its successful owner verification
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW_RUN_ID: ${{ inputs.ci_workflow_run_id }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF:-}" = "refs/heads/main" || { echo 'workflow ref is not main'; exit 1; }
          git fetch --no-tags origin main
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "${GITHUB_SHA:-}" = "$MAIN_SHA" || { echo 'workflow SHA is not current main'; exit 1; }
          test "$(git rev-parse HEAD)" = "$MAIN_SHA" || { echo 'checkout is not current main'; exit 1; }
          test -n "$CI_WORKFLOW_RUN_ID" && [[ "$CI_WORKFLOW_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'numeric CI workflow run ID is required'; exit 1; }
          CI="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_WORKFLOW_RUN_ID")"
          test "$(jq -r .repository.full_name <<<"$CI")" = "$GITHUB_REPOSITORY" || { echo 'required CI belongs to another repository'; exit 1; }
          test "$(jq -r .head_sha <<<"$CI")" = "$MAIN_SHA" || { echo 'required CI is not for current main'; exit 1; }
          test "$(jq -r .status <<<"$CI")" = completed && test "$(jq -r .conclusion <<<"$CI")" = success || { echo 'required CI was not successful'; exit 1; }
          test "$(jq -r .path <<<"$CI")" = .github/workflows/owner-dashboard-ci.yml || { echo 'wrong required CI workflow'; exit 1; }
          test "$(jq -r .name <<<"$CI")" = "Owner dashboard verification" || { echo 'wrong required CI workflow name'; exit 1; }
          test "$(jq -r .event <<<"$CI")" = push || { echo 'required CI was not a push run'; exit 1; }
          test "$(jq -r .head_branch <<<"$CI")" = main || { echo 'required CI was not for the main branch'; exit 1; }
          echo "MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
      - name: Install locked diagnostic dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - name: Diagnose exact retained dashboard runtime credential without mutation
        env:
          DASHBOARD_PRIOR_MANAGED_SECRETS_JSON: ${{ secrets.DASHBOARD_PRIOR_MANAGED_SECRETS_JSON }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail; umask 077
          test -n "$DASHBOARD_PRIOR_MANAGED_SECRETS_JSON" && test -n "$SUPABASE_PROJECT_REF"
          python scripts/dashboard_runtime_diagnostic.py \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --main-sha "$MAIN_SHA" \
            --output "$RUNNER_TEMP/dashboard-runtime-diagnostic.json"
      - name: Upload bounded dashboard runtime diagnostic receipt
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: production-dashboard-runtime-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dashboard-runtime-diagnostic.json
          if-no-files-found: error
          retention-days: 30
