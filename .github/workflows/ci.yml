name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: setup-node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: install-system-dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-17
      - name: install-dependencies
        run: |
          python -m pip install --requirement requirements-ci.txt
          npm ci
      - name: scan-secrets
        run: python scripts/ci_policy_checks.py scan-secrets
      - name: dependency-audit
        run: |
          python -m pip_audit --strict --requirement requirements-ci.txt
          npm audit --audit-level=high --omit=optional
      - name: sql-lint
        run: python scripts/ci_policy_checks.py sql-lint
      - name: migration-current
        env:
          POSTGRES_BIN: /usr/lib/postgresql/17/bin
        run: python scripts/verify_multitenancy_migration.py --rollback-only
      - name: fresh-schema
        env:
          POSTGRES_BIN: /usr/lib/postgresql/17/bin
        run: python -m pytest tests/security/test_rls_catalog.py -q
      - name: surface-allowlist
        env:
          POSTGRES_BIN: /usr/lib/postgresql/17/bin
        run: python -m pytest tests/security/test_rls_catalog.py::test_api_schema_is_an_exact_invoker_view_allowlist -q
      - name: all-tests
        env:
          POSTGRES_BIN: /usr/lib/postgresql/17/bin
        run: npm run test:all
      - name: build-output-scan
        run: python scripts/deploy_and_verify.py scan-build --dist apps/web/dist
