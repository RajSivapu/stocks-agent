name: One-time existing V1 runtime baseline attestation

on:
  workflow_dispatch:
    inputs:
      ci_workflow_run_id:
        description: Successful exact-main owner CI workflow run ID
        required: true
        type: string
      reconciliation_workflow_run_id:
        description: Completed protected production schema reconciliation run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: protected-existing-v1-runtime-attestation-production
  cancel-in-progress: false

jobs:
  attest:
    environment: owner-dashboard-production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.14"
      - name: Bind checkout to current main and its successful owner verification
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW_RUN_ID: ${{ inputs.ci_workflow_run_id }}
          RECONCILIATION_WORKFLOW_RUN_ID: ${{ inputs.reconciliation_workflow_run_id }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF:-}" = "refs/heads/main" || { echo 'workflow ref is not main'; exit 1; }
          git fetch --no-tags origin main
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          test "${GITHUB_SHA:-}" = "$MAIN_SHA" || { echo 'workflow SHA is not current main'; exit 1; }
          test "$(git rev-parse HEAD)" = "$MAIN_SHA" || { echo 'checkout is not current main'; exit 1; }
          test -n "$CI_WORKFLOW_RUN_ID" && [[ "$CI_WORKFLOW_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'numeric CI workflow run ID is required'; exit 1; }
          CI="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_WORKFLOW_RUN_ID")"
          test "$(jq -r .repository.full_name <<<"$CI")" = "$GITHUB_REPOSITORY" || { echo 'required CI belongs to another repository'; exit 1; }
          test "$(jq -r .head_sha <<<"$CI")" = "$MAIN_SHA" || { echo 'required CI is not for current main'; exit 1; }
          test "$(jq -r .status <<<"$CI")" = completed && test "$(jq -r .conclusion <<<"$CI")" = success || { echo 'required CI was not successful'; exit 1; }
          test "$(jq -r .path <<<"$CI")" = .github/workflows/owner-dashboard-ci.yml || { echo 'wrong required CI workflow'; exit 1; }
          test "$(jq -r .name <<<"$CI")" = "Owner dashboard verification" || { echo 'wrong required CI workflow name'; exit 1; }
          test "$(jq -r .event <<<"$CI")" = push && test "$(jq -r .head_branch <<<"$CI")" = main || { echo 'required CI was not an exact-main push'; exit 1; }
          test -n "$RECONCILIATION_WORKFLOW_RUN_ID" && [[ "$RECONCILIATION_WORKFLOW_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'numeric reconciliation workflow run ID is required'; exit 1; }
          RECONCILIATION="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECONCILIATION_WORKFLOW_RUN_ID")"
          test "$(jq -r .repository.full_name <<<"$RECONCILIATION")" = "$GITHUB_REPOSITORY" || { echo 'reconciliation belongs to another repository'; exit 1; }
          test "$(jq -r .status <<<"$RECONCILIATION")" = completed && test "$(jq -r .conclusion <<<"$RECONCILIATION")" = success || { echo 'reconciliation was not successful'; exit 1; }
          test "$(jq -r .path <<<"$RECONCILIATION")" = .github/workflows/production-schema-reconciliation.yml || { echo 'wrong reconciliation workflow'; exit 1; }
          test "$(jq -r .name <<<"$RECONCILIATION")" = "Production schema reconciliation" || { echo 'wrong reconciliation workflow name'; exit 1; }
          test "$(jq -r .event <<<"$RECONCILIATION")" = workflow_dispatch && test "$(jq -r .head_branch <<<"$RECONCILIATION")" = main || { echo 'reconciliation was not a protected main run'; exit 1; }
          RECONCILIATION_SHA="$(jq -r .head_sha <<<"$RECONCILIATION")"
          git merge-base --is-ancestor "$RECONCILIATION_SHA" "$MAIN_SHA" || { echo 'reconciliation is not an ancestor of current main'; exit 1; }
          ARTIFACT_NAME="production-schema-reconciliation-$RECONCILIATION_WORKFLOW_RUN_ID-1"
          ARTIFACTS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECONCILIATION_WORKFLOW_RUN_ID/artifacts")"
          ARTIFACT="$(jq -ce --arg name "$ARTIFACT_NAME" '[.artifacts[] | select(.name == $name and .expired == false)] | if length == 1 then .[0] else error("exact reconciliation artifact is unavailable") end' <<<"$ARTIFACTS")"
          RECONCILIATION_ARTIFACT_ID="$(jq -r .id <<<"$ARTIFACT")"
          RECONCILIATION_ARTIFACT_DIGEST="$(jq -r .digest <<<"$ARTIFACT")"
          test -n "$RECONCILIATION_ARTIFACT_ID" && [[ "$RECONCILIATION_ARTIFACT_ID" =~ ^[0-9]+$ ]] || { echo 'reconciliation artifact identity is invalid'; exit 1; }
          [[ "$RECONCILIATION_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'reconciliation artifact digest is invalid'; exit 1; }
          echo "MAIN_SHA=$MAIN_SHA" >> "$GITHUB_ENV"
          echo "RECONCILIATION_WORKFLOW_RUN_ID=$RECONCILIATION_WORKFLOW_RUN_ID" >> "$GITHUB_ENV"
          echo "RECONCILIATION_ARTIFACT_ID=$RECONCILIATION_ARTIFACT_ID" >> "$GITHUB_ENV"
          echo "RECONCILIATION_ARTIFACT_DIGEST=$RECONCILIATION_ARTIFACT_DIGEST" >> "$GITHUB_ENV"
          echo "RECONCILIATION_ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"
      - name: Install locked attestation dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - name: Download the exact completed reconciliation receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/reconciliation.zip"
          mkdir -p "$RUNNER_TEMP/reconciliation"
          gh api \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$RECONCILIATION_ARTIFACT_ID/zip" \
            > "$ARCHIVE"
          ACTUAL_ARCHIVE_DIGEST="sha256:$(sha256sum "$ARCHIVE" | cut -d ' ' -f 1)"
          test "$ACTUAL_ARCHIVE_DIGEST" = "$RECONCILIATION_ARTIFACT_DIGEST" || {
            echo 'reconciliation artifact archive digest differs from GitHub metadata'
            exit 1
          }
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/reconciliation"
          test -f "$RUNNER_TEMP/reconciliation/schema-reconciliation-receipt.json"
      - name: Attest existing production runtime without mutation
        env:
          DASHBOARD_OWNER_EMAIL: ${{ secrets.DASHBOARD_OWNER_EMAIL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DASHBOARD_DATABASE_URL_SHA256: ${{ vars.DASHBOARD_DATABASE_URL_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$DASHBOARD_OWNER_EMAIL" && test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_PROJECT_REF" && test -n "$SUPABASE_PUBLISHABLE_KEY"
          test -n "$SUPABASE_SERVICE_ROLE_KEY" && test -n "$DASHBOARD_DATABASE_URL_SHA256"
          python scripts/attest_existing_v1_runtime.py \
            --candidate-sha "$MAIN_SHA" \
            --production-project-ref "$SUPABASE_PROJECT_REF" \
            --native-site-receipt docs/receipts/2026-09-06-native-site-v5.json \
            --reconciliation-receipt "$RUNNER_TEMP/reconciliation/schema-reconciliation-receipt.json" \
            --reconciliation-workflow-run-id "$RECONCILIATION_WORKFLOW_RUN_ID" \
            --reconciliation-artifact-id "$RECONCILIATION_ARTIFACT_ID" \
            --reconciliation-artifact-digest "$RECONCILIATION_ARTIFACT_DIGEST" \
            --output "$RUNNER_TEMP/existing-v1-runtime-attestation.json"
      - name: Upload immutable runtime attestation
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: existing-v1-runtime-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/existing-v1-runtime-attestation.json
          if-no-files-found: error
          retention-days: 90
