name: Protected recovery journal compaction

on:
  workflow_dispatch:
    inputs:
      candidate_sha: {description: Reviewed main SHA (hint only), required: true, type: string}
      reviewed_sha: {description: Exact approved PR head SHA (hint only), required: true, type: string}
      pr_ci_workflow_run_id: {description: Successful exact-head PR CI run (hint only), required: true, type: string}
      ci_workflow_run_id: {description: Successful exact-main CI run (hint only), required: true, type: string}
      pull_request_number: {description: Reviewed merged PR (hint only), required: true, type: string}

permissions:
  actions: read
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: protected-owner-dashboard-release-production
  cancel-in-progress: false

jobs:
  compact:
    environment: owner-dashboard-production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PGSSLMODE: verify-full
      PGSSLROOTCERT: ${{ github.workspace }}/config/supabase-prod-ca-2021.crt
    steps:
      - name: Authenticate exact reviewed main candidate without candidate code
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.candidate_sha }}
          INPUT_REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          INPUT_PR_CI_RUN_ID: ${{ inputs.pr_ci_workflow_run_id }}
          INPUT_CI_RUN_ID: ${{ inputs.ci_workflow_run_id }}
          INPUT_PR: ${{ inputs.pull_request_number }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'GitHub token is required'; exit 1; }
          [[ "$INPUT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'candidate SHA is malformed'; exit 1; }
          [[ "$INPUT_REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'reviewed SHA is malformed'; exit 1; }
          [[ "$INPUT_PR_CI_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'numeric PR CI workflow run ID is required'; exit 1; }
          [[ "$INPUT_CI_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'numeric CI workflow run ID is required'; exit 1; }
          [[ "$INPUT_PR" =~ ^[1-9][0-9]*$ ]] || { echo 'numeric pull request number is required'; exit 1; }
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          CANDIDATE_SHA="$INPUT_SHA"; PR_CI_WORKFLOW_RUN_ID="$INPUT_PR_CI_RUN_ID"; CI_WORKFLOW_RUN_ID="$INPUT_CI_RUN_ID"; PULL_REQUEST_NUMBER="$INPUT_PR"
          export CANDIDATE_SHA
          test "${GITHUB_REF:-}" = "refs/heads/main" || { echo 'manual compaction ref is not main'; exit 1; }
          test "${GITHUB_SHA:-}" = "$CANDIDATE_SHA" || { echo 'manual compaction SHA does not bind candidate'; exit 1; }
          test "$CANDIDATE_SHA" = "$MAIN_SHA" || { echo 'candidate SHA/ref mismatch'; exit 1; }
          CI="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_WORKFLOW_RUN_ID")"
          test "$(jq -r .repository.full_name <<<"$CI")" = "$GITHUB_REPOSITORY" || { echo 'required CI belongs to another repository'; exit 1; }
          test "$(jq -r .head_sha <<<"$CI")" = "$CANDIDATE_SHA" || { echo 'candidate SHA/ref mismatch'; exit 1; }
          test "$(jq -r .status <<<"$CI")" = completed && test "$(jq -r .conclusion <<<"$CI")" = success || { echo 'required CI was not successful'; exit 1; }
          test "$(jq -r .path <<<"$CI")" = .github/workflows/owner-dashboard-ci.yml || { echo 'wrong required CI workflow'; exit 1; }
          test "$(jq -r .name <<<"$CI")" = "Owner dashboard verification" || { echo 'required CI workflow name mismatch'; exit 1; }
          test "$(jq -r .event <<<"$CI")" = push && test "$(jq -r .head_branch <<<"$CI")" = main || { echo 'required CI was not an exact-main push'; exit 1; }
          PR="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER")"
          test "$(jq -r .base.repo.full_name <<<"$PR")" = "$GITHUB_REPOSITORY" || { echo 'reviewed PR belongs to another repository'; exit 1; }
          test "$(jq -r .merged <<<"$PR")" = true && test "$(jq -r .base.ref <<<"$PR")" = main && test "$(jq -r .merge_commit_sha <<<"$PR")" = "$CANDIDATE_SHA" || { echo 'candidate SHA/ref mismatch'; exit 1; }
          jq -e '(.head.ref | type == "string" and length > 0) and (.head.repo.full_name | type == "string" and length > 0)' <<<"$PR" >/dev/null || { echo 'reviewed PR head coordinates are unavailable'; exit 1; }
          PR_HEAD_SHA="$(jq -r .head.sha <<<"$PR")"
          PR_HEAD_REF="$(jq -r .head.ref <<<"$PR")"
          PR_HEAD_REPO="$(jq -r .head.repo.full_name <<<"$PR")"
          test "$INPUT_REVIEWED_SHA" = "$PR_HEAD_SHA" || { echo 'input reviewed SHA is not the exact PR head'; exit 1; }
          HEAD_COMMIT="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$PR_HEAD_SHA")"
          CANDIDATE_COMMIT="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$CANDIDATE_SHA")"
          test "$(jq -r .tree.sha <<<"$HEAD_COMMIT")" = "$(jq -r .tree.sha <<<"$CANDIDATE_COMMIT")" || { echo 'reviewed and candidate Git trees differ'; exit 1; }
          HEAD_COMMIT_TIME="$(jq -r .committer.date <<<"$HEAD_COMMIT")"
          CANDIDATE_COMMIT_TIME="$(jq -r .committer.date <<<"$CANDIDATE_COMMIT")"
          MERGED_AT="$(jq -r .merged_at <<<"$PR")"
          PR_CI="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PR_CI_WORKFLOW_RUN_ID")"
          test "$(jq -r .repository.full_name <<<"$PR_CI")" = "$GITHUB_REPOSITORY" || { echo 'required PR CI belongs to another repository'; exit 1; }
          test "$(jq -r .head_sha <<<"$PR_CI")" = "$PR_HEAD_SHA" || { echo 'required PR CI does not bind reviewed head'; exit 1; }
          test "$(jq -r .status <<<"$PR_CI")" = completed && test "$(jq -r .conclusion <<<"$PR_CI")" = success || { echo 'required PR CI was not successful'; exit 1; }
          test "$(jq -r .path <<<"$PR_CI")" = .github/workflows/owner-dashboard-ci.yml || { echo 'wrong required PR CI workflow'; exit 1; }
          test "$(jq -r .name <<<"$PR_CI")" = "Owner dashboard verification" || { echo 'required PR CI workflow name mismatch'; exit 1; }
          test "$(jq -r .event <<<"$PR_CI")" = pull_request || { echo 'required PR CI was not a pull request run'; exit 1; }
          PR_CI_BINDING_FILTER='(.head_branch | type == "string" and length > 0) and (.head_repository.full_name | type == "string" and length > 0) and .head_branch == $head_ref and .head_repository.full_name == $head_repo and (.pull_requests | type == "array" and all(.[]; (.number | type) == "number" and .number > 0 and (.number | floor) == .number) and (length == 0 or any(.[]; .number == $number)))'
          jq -e --argjson number "$PULL_REQUEST_NUMBER" --arg head_ref "$PR_HEAD_REF" --arg head_repo "$PR_HEAD_REPO" "$PR_CI_BINDING_FILTER" <<<"$PR_CI" >/dev/null || { echo 'required PR CI does not bind reviewed pull request'; exit 1; }
          PR_CI_COMPLETED_AT="$(jq -r .updated_at <<<"$PR_CI")"
          jq -e --arg head "$HEAD_COMMIT_TIME" --arg merged "$MERGED_AT" '.updated_at >= $head and .updated_at <= $merged' <<<"$PR_CI" >/dev/null || { echo 'required PR CI did not complete between reviewed head and merge'; exit 1; }
          REVIEWS="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST_NUMBER/reviews?per_page=100")"
          test "$(jq 'length' <<<"$REVIEWS")" -lt 100 || { echo 'review evidence exceeds bounded page'; exit 1; }
          if jq -e --arg sha "$PR_HEAD_SHA" --arg head "$HEAD_COMMIT_TIME" --arg merged "$MERGED_AT" --arg candidate "$CANDIDATE_COMMIT_TIME" \
            '[.[] | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")] | (all(.[]; (.id | type == "number" and . > 0)) and (group_by(.user.id) | map(max_by([.submitted_at // "", .id])) | (all(.state != "CHANGES_REQUESTED") and any(.state == "APPROVED" and .commit_id == $sha and (.submitted_at >= $head and .submitted_at <= $merged) and ($merged <= $candidate)))))' \
            <<<"$REVIEWS" >/dev/null; then
            AUTHORIZATION_KIND=github_review
            AUTHORIZATION_ID="$(jq -r --arg sha "$PR_HEAD_SHA" --arg head "$HEAD_COMMIT_TIME" --arg merged "$MERGED_AT" '[.[] | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")] | group_by(.user.id) | map(max_by([.submitted_at // "", .id])) | [.[] | select(.state == "APPROVED" and .commit_id == $sha and .submitted_at >= $head and .submitted_at <= $merged)] | max_by([.submitted_at, .id]) | .id' <<<"$REVIEWS")"
          else
            COMMENTS="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PULL_REQUEST_NUMBER/comments?per_page=100")"
            test "$(jq 'length' <<<"$COMMENTS")" -lt 100 || { echo 'owner authorization evidence exceeds bounded page'; exit 1; }
            OWNER_ID="$(gh api "repos/$GITHUB_REPOSITORY" --jq .owner.id)"
            EXPECTED_OWNER_APPROVAL="$(printf 'OWNER_RECOVERY_JOURNAL_COMPACTION_APPROVAL_V1\nreviewed_sha=%s\npr_ci_workflow_run_id=%s' "$PR_HEAD_SHA" "$PR_CI_WORKFLOW_RUN_ID")"
            OWNER_APPROVAL="$(jq -c --arg body "$EXPECTED_OWNER_APPROVAL" --argjson owner "$OWNER_ID" --arg pr_ci "$PR_CI_COMPLETED_AT" --arg merged "$MERGED_AT" '[.[] | select((.id | type == "number") and .id > 0 and .user.id == $owner and .author_association == "OWNER" and (.body == $body or .body == ($body + "\n")) and .created_at >= $pr_ci and .created_at <= .updated_at and .updated_at <= $merged)] | sort_by([.created_at, .id]) | last // empty' <<<"$COMMENTS")"
            test -n "$OWNER_APPROVAL" || { echo 'latest required review or CI-bound owner approval is missing'; exit 1; }
            jq -e '[.[] | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")] | group_by(.user.id) | map(max_by([.submitted_at // "", .id])) | all(.state != "CHANGES_REQUESTED")' <<<"$REVIEWS" >/dev/null || { echo 'current changes-requested review blocks owner approval'; exit 1; }
            AUTHORIZATION_KIND=owner_comment
            AUTHORIZATION_ID="$(jq -r .id <<<"$OWNER_APPROVAL")"
          fi
          [[ "$AUTHORIZATION_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'compaction authorization identity is malformed'; exit 1; }
          echo "candidate_sha=$CANDIDATE_SHA" >> "$GITHUB_OUTPUT"
          echo "reviewed_sha=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "pr_ci_workflow_run_id=$PR_CI_WORKFLOW_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "ci_workflow_run_id=$CI_WORKFLOW_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "pull_request_number=$PULL_REQUEST_NUMBER" >> "$GITHUB_OUTPUT"
          echo "authorization_kind=$AUTHORIZATION_KIND" >> "$GITHUB_OUTPUT"
          echo "authorization_id=$AUTHORIZATION_ID" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ steps.candidate.outputs.candidate_sha }}
          fetch-depth: 0
      - name: Fetch exact reviewed PR head for local tree verification
        env:
          PULL_REQUEST_NUMBER: ${{ steps.candidate.outputs.pull_request_number }}
          REVIEWED_SHA: ${{ steps.candidate.outputs.reviewed_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/pull/${PULL_REQUEST_NUMBER}/head"
          test "$(git rev-parse FETCH_HEAD)" = "$REVIEWED_SHA" || { echo 'fetched PR head does not match reviewed SHA'; exit 1; }
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.14"
      - name: Install locked compaction dependencies
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/recovery-journal-compaction-venv"
          "$RUNNER_TEMP/recovery-journal-compaction-venv/bin/python" -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - name: Compact authenticated terminal recovery journals
        env:
          RELEASE_RECOVERY_KEY: ${{ secrets.RELEASE_RECOVERY_KEY }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPAVISOR_SESSION_URL: ${{ secrets.SUPAVISOR_SESSION_URL }}
          MAIN_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail; umask 077
          test -n "$RELEASE_RECOVERY_KEY" && test -n "$SUPABASE_PROJECT_REF" && test -n "$SUPAVISOR_SESSION_URL"
          "$RUNNER_TEMP/recovery-journal-compaction-venv/bin/python" -m scripts.compact_recovery_journals \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --admin-url "$SUPAVISOR_SESSION_URL" \
            --main-sha "$MAIN_SHA" \
            --expected-rows 467 \
            --expected-groups 45 \
            --output "$RUNNER_TEMP/recovery-journal-compaction.json"
      - name: Upload bounded recovery-journal compaction receipt
        id: compaction_receipt
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: recovery-journal-compaction-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery-journal-compaction.json
          if-no-files-found: error
          retention-days: 90
      - name: Bind compaction receipt to this exact main run
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.compaction_receipt.outputs.artifact-id }}
          MAIN_SHA: ${{ steps.candidate.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]] || { echo 'compaction artifact ID is malformed'; exit 1; }
          EXPECTED_NAME="recovery-journal-compaction-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ARTIFACT="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID")"
          ARTIFACT_DIGEST="$(jq -r .digest <<<"$ARTIFACT")"
          [[ "$ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'compaction artifact digest is malformed'; exit 1; }
          ARTIFACT_BINDING_FILTER='(.id | type) == "number" and .id > 0 and (.id | floor) == .id and .id == $artifact_id and .name == $name and .digest == $digest and .expired == false and .workflow_run.id == $run and .workflow_run.head_sha == $sha and (.size_in_bytes | type) == "number" and .size_in_bytes > 0 and (.size_in_bytes | floor) == .size_in_bytes and .size_in_bytes <= 65536'
          jq -e --argjson artifact_id "$ARTIFACT_ID" \
            --arg name "$EXPECTED_NAME" --arg digest "$ARTIFACT_DIGEST" \
            --argjson run "$GITHUB_RUN_ID" --arg sha "$MAIN_SHA" \
            "$ARTIFACT_BINDING_FILTER" <<<"$ARTIFACT" >/dev/null || { echo 'compaction artifact binding is not exact'; exit 1; }
