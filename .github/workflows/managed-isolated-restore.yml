name: Managed isolated recovery restore

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: managed-isolated-recovery-restore
  cancel-in-progress: false

jobs:
  restore:
    environment: owner-dashboard-production
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.14"
      - name: Bind checkout to current main and its successful owner verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF:-}" = "refs/heads/main" || { echo 'workflow ref is not main'; exit 1; }
          git fetch --no-tags origin main
          MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          export MAIN_SHA
          test "${GITHUB_SHA:-}" = "$MAIN_SHA" || { echo 'workflow SHA is not current main'; exit 1; }
          test "$(git rev-parse HEAD)" = "$MAIN_SHA" || { echo 'checkout is not current main'; exit 1; }
          VERIFIED="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/owner-dashboard-ci.yml/runs?head_sha=$MAIN_SHA&status=completed&per_page=100" --jq '[.workflow_runs[] | select(.head_sha == env.MAIN_SHA and .conclusion == "success" and .name == "Owner dashboard verification")] | length')"
          test "$VERIFIED" -ge 1 || { echo 'exact-main Owner dashboard verification is required'; exit 1; }
      - name: Install locked recovery dependencies
        run: >-
          python -m pip install --require-hashes --only-binary=:all: -r requirements.lock
      - name: Run protected management-API-only drill
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RELEASE_RECOVERY_KEY: ${{ secrets.RELEASE_RECOVERY_KEY }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" && test -n "$RELEASE_RECOVERY_KEY" && test -n "$SUPABASE_PROJECT_REF"
          mkdir -m 700 recovery
          python scripts/managed_isolated_restore.py --production-project-ref "$SUPABASE_PROJECT_REF" --output-dir recovery --workflow-run-id "$GITHUB_RUN_ID" --workflow-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Independently clean only this run-bound temporary project
        if: ${{ always() }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RELEASE_RECOVERY_KEY: ${{ secrets.RELEASE_RECOVERY_KEY }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          mkdir -p recovery
          python scripts/managed_isolated_restore.py --cleanup-only --production-project-ref "$SUPABASE_PROJECT_REF" --output-dir recovery --cleanup-identity recovery/cleanup-identity.json --workflow-run-id "$GITHUB_RUN_ID" --workflow-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload encrypted recovery evidence and receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: managed-isolated-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: recovery
          if-no-files-found: error
          retention-days: 90
  cleanup:
    needs: restore
    if: ${{ always() }}
    environment: owner-dashboard-production
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.14"
      - name: Bind cleanup to the reviewed main dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF:-}" = "refs/heads/main" || { echo 'cleanup dispatch ref is not main'; exit 1; }
          VERIFIED="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/owner-dashboard-ci.yml/runs?head_sha=$GITHUB_SHA&status=completed&per_page=100" --jq '[.workflow_runs[] | select(.head_sha == env.GITHUB_SHA and .conclusion == "success" and .name == "Owner dashboard verification")] | length')"
          test "$VERIFIED" -ge 1 || { echo 'exact-dispatch Owner dashboard verification is required'; exit 1; }
      - name: Derive and clean only this workflow run's temporary project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RELEASE_RECOVERY_KEY: ${{ secrets.RELEASE_RECOVERY_KEY }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" && test -n "$RELEASE_RECOVERY_KEY" && test -n "$SUPABASE_PROJECT_REF"
          mkdir -m 700 cleanup-recovery
          python scripts/managed_isolated_restore.py --cleanup-only --production-project-ref "$SUPABASE_PROJECT_REF" --output-dir cleanup-recovery --cleanup-identity cleanup-recovery/cleanup-identity.json --workflow-run-id "$GITHUB_RUN_ID" --workflow-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload durable cleanup receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: managed-isolated-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: cleanup-recovery/managed-isolated-cleanup-receipt.json
          if-no-files-found: error
          retention-days: 90
