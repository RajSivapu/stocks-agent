name: Protected owner dashboard release recovery

on:
  workflow_run:
    workflows: ["Protected owner dashboard release"]
    types: [completed]

permissions:
  actions: read
  contents: read
  deployments: write

concurrency:
  group: protected-owner-dashboard-recovery-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  recover:
    # A separate workflow survives cancellation, timeout, and runner loss.
    if: github.event.workflow_run.conclusion != 'success'
    environment: owner-dashboard-production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {ref: ${{ github.event.workflow_run.head_sha }}}
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with: {python-version: "3.14"}
      - name: Download separate durable source and recovery metadata
        env: {GH_TOKEN: ${{ github.token }}}
        run: |
          set -euo pipefail
          mkdir -m 700 recovery recovery-source recovery-metadata
          gh run download "${{ github.event.workflow_run.id }}" --name "rollback-source-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}" --dir recovery-source
          gh run download "${{ github.event.workflow_run.id }}" --name "recovery-metadata-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}" --dir recovery-metadata
          test -f recovery-metadata/recovery-metadata/release-state.json
          test -f recovery-metadata/recovery-metadata/rollback-capture.json
          test -f recovery-source/index.ts
      - name: Record terminal deployment status without bypassing recovery
        id: deployment
        env: {GH_TOKEN: ${{ github.token }}}
        run: |
          set -euo pipefail
          DEPLOYMENT_ID="$(jq -r .deployment_id recovery-metadata/recovery-metadata/release-state.json)"
          DEPLOYMENT_STATUS="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" --jq '.[0].state')"
          echo "DEPLOYMENT_ID=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "terminal_status=$DEPLOYMENT_STATUS" >> "$GITHUB_OUTPUT"
      - name: Restore durable gateway recovery artifact
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          # A failed restore deliberately retains the downloaded artifact for
          # GitHub's retention window and causes this independent job to fail.
          python -m pip install --requirement requirements-test.txt
          mkdir -p recovery/rollback-worktree/supabase/functions/market-briefing-gateway
          cp -R recovery-source/. recovery/rollback-worktree/supabase/functions/market-briefing-gateway/
          python scripts/restore_gateway_after_release_failure.py --project-ref "$PROJECT_REF" --admin-url "$POSTGRES_URL" --release-state recovery-metadata/recovery-metadata/release-state.json --recovery-root recovery/rollback-worktree --retain-recovery-artifact
