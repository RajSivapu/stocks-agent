project_id = "stocks-agent"

[api]
enabled = true
port = 54321
schemas = ["api"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/auth/callback"]
jwt_expiry = 900
enable_signup = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 600

[auth.email.template.magic_link]
subject = "Your Stock Agent sign-in code"
content_path = "./supabase/templates/magic_link.html"

[functions."telegram-portfolio"]
enabled = true
verify_jwt = false
entrypoint = "./functions/telegram-portfolio/index.ts"

[functions."market-briefing-gateway"]
enabled = true
verify_jwt = false
entrypoint = "./functions/market-briefing-gateway/index.ts"

[functions."app-api"]
enabled = true
verify_jwt = false
entrypoint = "./functions/app-api/index.ts"

[functions."agent-gateway"]
enabled = true
verify_jwt = false
entrypoint = "./functions/agent-gateway/index.ts"

[functions."run-scheduler"]
enabled = true
verify_jwt = false
entrypoint = "./functions/run-scheduler/index.ts"
